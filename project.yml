name: Cadence
options:
  bundleIdPrefix: com.nulljosh
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Cadence-iOS:
    type: application
    platform: iOS
    bundleId: com.nulljosh.cadence
    sources:
      - path: Sources
        excludes:
          - "macOS/**"
    settings:
      base:
        INFOPLIST_FILE: Sources/iOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.cadence
        TARGETED_DEVICE_FAMILY: "1,2"
        # Cadence had no asset catalog at all until 2026-08-30, so both targets built with
        # no icon. On macOS this setting is what wires the catalog up; iOS auto-detects a
        # set named AppIcon, but set it on both so the two targets read the same.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - sdk: Charts.framework

  Cadence-macOS:
    type: application
    platform: macOS
    bundleId: com.nulljosh.cadence.mac
    sources:
      - path: Sources
        excludes:
          - "iOS/**"
    settings:
      base:
        INFOPLIST_FILE: Sources/macOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.cadence.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - sdk: Charts.framework
